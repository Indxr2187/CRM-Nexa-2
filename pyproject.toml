[project]
name = "nexa-crm"
version = "1.0.0"
requires-python = ">=3.12"

dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Flask-Login>=0.6,<1.0",
    "Flask-WTF>=1.2,<2.0",
    "Flask-Migrate>=4.0,<5.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0"
]
[tool.vercel]
entrypoint = "index:app"