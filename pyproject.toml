[project]
name = "nexa-crm"
version = "1.0.0"
requires-python = ">=3.12"

dependencies = [
    "flask>=3.0,<4.0",
    "flask-sqlalchemy>=3.1,<4.0",
    "flask-login>=0.6,<1.0",
    "flask-wtf>=1.2,<2.0",
    "flask-migrate>=4.0,<5.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "email-validator>=2.1,<3.0"
]
[tool.vercel]
entrypoint = "index:app"